<title>Cluppi</title>
<style>
:root{--bg:#F6F3EF;--card:#FFFFFF;--ink:#1E1E1E;--muted:#6B6865;--accent:#FF5630}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.4 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;padding:32px 20px;text-align:center}
.tile{width:96px;height:96px;margin:0 auto 24px;border-radius:25px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.mark{width:56px;height:auto}
h1{font-size:24px;margin:0 0 8px}
p{margin:0 0 24px;color:var(--muted)}
.btn{display:block;width:100%;padding:16px;margin:0 0 12px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px}
.primary{background:var(--ink);color:#fff}
.secondary{background:var(--card);color:var(--ink)}
.note{font-size:14px;margin-top:20px}
.code{font-weight:700;color:var(--ink)}
.desktop{display:none}
@media (hover:hover) and (pointer:fine){.desktop{display:block}}
</style>
</head>
